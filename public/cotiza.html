<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cotiza tu letrero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --fondo: #07080d; --caja: #11131c; --caja2: #171a26; --borde: #262a3a; --texto: #f1f3f9; --suave: #9aa1b8; --a1: #22d3ee; --a2: #a855f7; --a3: #ec4899; --ok: #34d399; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--fondo); color: var(--texto); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    body { background: radial-gradient(1200px 600px at 50% -10%, rgba(168,85,247,.18), transparent 60%), radial-gradient(900px 500px at 100% 30%, rgba(34,211,238,.08), transparent 60%), var(--fondo); min-height: 100vh; }
    .cx { max-width: 760px; margin: 0 auto; padding: 22px 16px 120px; }
    .marca { text-align: center; font-weight: 800; letter-spacing: .14em; font-size: 13px; color: var(--suave); text-transform: uppercase; margin-bottom: 18px; }
    h1 { font-size: clamp(30px, 7vw, 52px); line-height: 1.05; text-align: center; margin: 6px 0 12px; font-weight: 800; }
    h1 .brilla { background: linear-gradient(90deg, var(--a1), var(--a2), var(--a3)); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 40px rgba(168,85,247,.35); }
    h2 { font-size: 24px; text-align: center; margin: 4px 0 6px; }
    .sub { text-align: center; color: var(--suave); font-size: 15px; line-height: 1.5; margin: 0 auto 22px; max-width: 520px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px 18px; border: 0; border-radius: 14px; font: inherit; font-weight: 700; font-size: 16px; color: #fff; cursor: pointer; background: linear-gradient(90deg, #0ea5e9, #7c3aed); box-shadow: 0 10px 30px rgba(124,58,237,.35); text-decoration: none; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.claro { background: transparent; border: 1px solid var(--borde); box-shadow: none; color: var(--texto); }
    .btn.wa { background: linear-gradient(90deg, #16a34a, #22c55e); box-shadow: 0 10px 30px rgba(34,197,94,.3); }
    .fila { display: flex; gap: 10px; margin-top: 16px; }
    .fila .btn { flex: 1; }
    .caja { background: var(--caja); border: 1px solid var(--borde); border-radius: 18px; padding: 18px; }
    .opciones { display: grid; gap: 12px; }
    .op { text-align: left; background: var(--caja); border: 1.5px solid var(--borde); border-radius: 16px; padding: 14px 16px; color: var(--texto); font: inherit; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
    .op b { display: block; font-size: 16px; margin-bottom: 4px; }
    .op small { color: var(--suave); font-size: 13px; line-height: 1.4; }
    .op .extra { float: right; font-size: 12px; font-weight: 700; color: var(--a1); background: rgba(34,211,238,.1); padding: 3px 8px; border-radius: 999px; }
    .op.on { border-color: var(--a2); box-shadow: 0 0 0 3px rgba(168,85,247,.25), 0 0 30px rgba(168,85,247,.2); }
    .subir { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 34px 16px; border: 2px dashed #343a52; border-radius: 18px; text-align: center; cursor: pointer; background: rgba(255,255,255,.02); }
    .subir:hover { border-color: var(--a2); }
    .subir .ico { font-size: 34px; }
    .subir small { color: var(--suave); }
    .pared { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 4 / 3; background: linear-gradient(180deg, #1c1f2b 0%, #12141c 70%, #0b0c12 70.2%, #15171f 100%); border: 1px solid var(--borde); display: flex; align-items: center; justify-content: center; }
    .pared::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: linear-gradient(180deg, rgba(0,0,0,.3), rgba(0,0,0,.6)); pointer-events: none; }
    .pared .logo { position: relative; z-index: 1; max-width: 80%; max-height: 62%; object-fit: contain; transition: width .1s; }
    .pared .logo.luz { filter: drop-shadow(0 0 6px rgba(255,255,255,.55)) drop-shadow(0 0 22px rgba(168,85,247,.6)); }
    .pared .medida { position: absolute; z-index: 2; color: #9ec5ff; font-size: 12px; font-weight: 700; }
    .pared .medida.an { bottom: 8%; left: 50%; transform: translateX(-50%); }
    .pared .medida.al { right: 4%; top: 50%; transform: translateY(-50%); }
    .maqueta { width: 100%; border-radius: 18px; border: 1px solid var(--borde); display: block; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
    .rango { width: 100%; accent-color: var(--a2); margin: 14px 0 6px; }
    .medidas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    label.campo { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--suave); }
    label.campo input, label.campo textarea { background: var(--caja2); border: 1px solid var(--borde); color: var(--texto); border-radius: 12px; padding: 12px; font: inherit; font-size: 16px; }
    textarea { resize: vertical; min-height: 70px; }
    .barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(10,11,17,.92); backdrop-filter: blur(10px); border-top: 1px solid var(--borde); padding: 12px 16px; display: none; }
    .barra.ver { display: block; }
    .barra .in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .barra .total { font-size: 22px; font-weight: 800; }
    .barra small { color: var(--suave); display: block; font-size: 12px; }
    .pasos { display: flex; gap: 6px; justify-content: center; margin: 0 0 18px; }
    .pasos i { width: 26px; height: 4px; border-radius: 4px; background: #2a2e40; }
    .pasos i.on { background: linear-gradient(90deg, var(--a1), var(--a2)); }
    .esfera { width: 110px; height: 110px; border-radius: 50%; margin: 30px auto 24px; background: radial-gradient(circle at 35% 30%, #fff, var(--c, #22d3ee) 35%, #000 120%); box-shadow: 0 0 60px var(--c, #22d3ee); animation: late 1.6s ease-in-out infinite; transition: background .6s, box-shadow .6s; }
    @keyframes late { 50% { transform: scale(1.08) rotate(8deg); } }
    .progreso { height: 6px; border-radius: 6px; background: #22263a; overflow: hidden; margin: 20px 0 8px; }
    .progreso div { height: 100%; width: 0; background: linear-gradient(90deg, var(--a1), var(--a2), var(--a3)); transition: width .5s; }
    .beneficio { text-align: center; color: var(--texto); font-weight: 600; min-height: 22px; transition: opacity .3s; }
    .desglose { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
    .desglose td { padding: 7px 0; border-bottom: 1px solid #1f2232; }
    .desglose td:last-child { text-align: right; font-weight: 600; }
    .desglose tr.tot td { font-size: 18px; font-weight: 800; border-bottom: 0; padding-top: 12px; }
    .aviso { background: rgba(250,204,21,.08); border: 1px solid rgba(250,204,21,.25); color: #fde68a; border-radius: 12px; padding: 10px 12px; font-size: 13px; margin: 12px 0; }
    .error { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #fecaca; border-radius: 12px; padding: 10px 12px; font-size: 14px; margin: 12px 0; }
    .galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .galeria figure { margin: 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--borde); background: var(--caja); }
    .galeria img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .galeria figcaption { font-size: 12px; color: var(--suave); padding: 7px 9px; }
    .seccion { margin-top: 34px; }
    .seccion h3 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--a1); text-align: center; margin: 0 0 12px; }
    .contador { display: flex; align-items: center; gap: 10px; }
    .contador button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--borde); background: var(--caja2); color: var(--texto); font-size: 20px; cursor: pointer; }
    .contador span { min-width: 30px; text-align: center; font-weight: 700; font-size: 18px; }
    .mini { color: var(--suave); font-size: 12.5px; text-align: center; margin-top: 10px; }
    .oculto { display: none !important; }
    .marca img { height: 46px; max-width: 80%; object-fit: contain; }
    .op.con-foto { display: flex; gap: 12px; align-items: center; padding: 10px; }
    .op-foto { position: relative; flex: 0 0 auto; }
    .op.con-foto img { width: 92px; height: 110px; object-fit: cover; border-radius: 12px; display: block; background: #000; }
    .op-foto em { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); font-style: normal; font-size: 9px; font-weight: 800; letter-spacing: .12em; color: #fff; background: rgba(0,0,0,.65); padding: 3px 7px; border-radius: 999px; backdrop-filter: blur(4px); }
    /* Recortar */
    .recorte { position: relative; margin-top: 12px; border-radius: 14px; overflow: hidden; background: #000; touch-action: none; user-select: none; }
    .recorte img { width: 100%; display: block; pointer-events: none; }
    .caja-rec { position: absolute; border: 2px dashed #fff; box-shadow: 0 0 0 9999px rgba(0,0,0,.55); cursor: move; touch-action: none; }
    .caja-rec i { position: absolute; width: 26px; height: 26px; border: 3px solid #fff; background: rgba(255,255,255,.15); touch-action: none; }
    .caja-rec i[data-h="nw"] { left: -13px; top: -13px; cursor: nwse-resize; }
    .caja-rec i[data-h="ne"] { right: -13px; top: -13px; cursor: nesw-resize; }
    .caja-rec i[data-h="sw"] { left: -13px; bottom: -13px; cursor: nesw-resize; }
    .caja-rec i[data-h="se"] { right: -13px; bottom: -13px; cursor: nwse-resize; }
    .enlace { background: none; border: 0; color: var(--a1); font: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; }
    /* Reseñas en tarjetas */
    .seccion h3.izq { text-align: left; color: #fbbf24; }
    .resenas { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px; }
    .resenas.auto { scroll-snap-type: none; }
    .resenas::-webkit-scrollbar { display: none; }
    .resena { flex: 0 0 86%; max-width: 420px; scroll-snap-align: start; display: flex; gap: 14px; background: var(--caja); border: 1px solid var(--borde); border-radius: 18px; padding: 12px; }
    .resena img { width: 38%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 12px; flex: 0 0 auto; }
    .resena.solo-foto { flex-basis: 60%; max-width: 260px; padding: 0; overflow: hidden; }
    .resena.solo-foto img { width: 100%; border-radius: 0; }
    .res-txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .res-txt p { margin: 0; font-size: 14px; line-height: 1.45; color: #e2e8f0; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
    .res-txt b { font-size: 15px; margin-top: auto; }
    .res-txt small { color: var(--suave); font-size: 12px; }
    .estrellas { color: #facc15; letter-spacing: 2px; font-size: 16px; }
    /* Carrusel tu logo → así quedó */
    .carrusel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; border-radius: 20px; }
    .carrusel::-webkit-scrollbar { display: none; }
    .slide { flex: 0 0 100%; scroll-snap-align: center; display: grid; gap: 10px; }
    .lado { position: relative; border-radius: 18px; overflow: hidden; background: var(--caja); border: 1px solid var(--borde); aspect-ratio: 16 / 10; display: flex; align-items: center; justify-content: center; }
    .lado img.antes { max-width: 55%; max-height: 70%; object-fit: contain; border-radius: 6px; }
    .lado img.despues { width: 100%; height: 100%; object-fit: cover; }
    .etq { position: absolute; top: 12px; left: 12px; z-index: 1; font-size: 12px; font-weight: 700; letter-spacing: .14em; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.08); color: #cbd5e1; backdrop-filter: blur(6px); }
    .etq.azul { left: auto; right: 12px; background: #1d6fe8; color: #fff; }
    .slide-tit { margin: 0; text-align: center; color: var(--suave); font-size: 13px; }
    .puntos { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
    .puntos button { width: 10px; height: 10px; padding: 0; border-radius: 50%; border: 1.5px solid #64748b; background: transparent; cursor: pointer; }
    .puntos button.on { background: #1d6fe8; border-color: #1d6fe8; }
    @media (min-width: 640px) { .slide { grid-template-columns: 1fr 1fr; } .slide-tit { grid-column: 1 / -1; } }
    /* Cinta que se mueve */
    .cinta { margin: 30px -16px 0; overflow: hidden; border-top: 1px solid #1a1d29; border-bottom: 1px solid #1a1d29; padding: 14px 0; }
    .cinta-in { display: flex; gap: 40px; width: max-content; animation: cinta 26s linear infinite; }
    .cinta span { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #cbd5e1; white-space: nowrap; }
    .cinta span::before { content: "✦"; margin-right: 40px; color: var(--a2); }
    @keyframes cinta { to { transform: translateX(-50%); } }
    /* 3 pasos */
    h2.grande { font-size: clamp(26px, 6vw, 38px); margin: 0 0 22px; }
    h2.grande.izq { text-align: left; }
    .pasos3 { text-align: center; }
    .paso3 { margin: 0 auto 26px; max-width: 320px; }
    .paso3 b { display: block; font-size: 18px; margin: 12px 0 6px; }
    .paso3 p { margin: 0; color: var(--suave); font-size: 15px; line-height: 1.5; }
    .ico3 { width: 54px; height: 54px; border-radius: 16px; background: #1f2433; color: #3b8cff; display: inline-flex; align-items: center; justify-content: center; }
    .ico3 svg { width: 26px; height: 26px; }
    .ico3.chico { width: 42px; height: 42px; border-radius: 50%; flex: 0 0 auto; }
    .ico3.chico svg { width: 20px; height: 20px; }
    @media (min-width: 640px) { .pasos3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; } .pasos3 h2 { grid-column: 1 / -1; } }
    /* De la maqueta a la realidad */
    .taller-txt { color: #cbd5e1; font-size: 16px; line-height: 1.6; margin: 0 0 16px; }
    .punto { display: flex; gap: 12px; align-items: center; background: var(--caja); border: 1px solid var(--borde); border-radius: 16px; padding: 14px; margin-bottom: 16px; }
    .punto b { display: block; font-size: 15px; }
    .punto small { color: var(--suave); font-size: 13px; }
    .taller-foto { width: 100%; border-radius: 18px; display: block; margin-top: 10px; border: 1px solid var(--borde); }
    @media (min-width: 640px) { .opciones.dos { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <main class="cx" id="app"><p class="sub">Cargando…</p></main>
  <div class="barra" id="barra"><div class="in"><div><small id="barraTxt">Precio estimado</small><span class="total" id="barraTotal">—</span></div><button class="btn" style="width:auto" id="barraBtn">Continuar</button></div></div>
  <script type="module" src="/js/cotiza.js"></script>
</body>
</html>
