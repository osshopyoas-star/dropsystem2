<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cotiza tu letrero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Bajar el código de una vez, en paralelo (sin esperar a que uno pida al otro) -->
  <link rel="modulepreload" href="/js/cotiza.js" />
  <link rel="modulepreload" href="/js/core/cotizador.js" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <style>
    :root { --fondo: #07080d; --caja: #11131c; --caja2: #171a26; --borde: #262a3a; --texto: #f1f3f9; --suave: #9aa1b8; --a1: #22d3ee; --a2: #a855f7; --a3: #ec4899; --ok: #34d399; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--fondo); color: var(--texto); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    body { background: radial-gradient(1200px 600px at 50% -10%, rgba(168,85,247,.18), transparent 60%), radial-gradient(900px 500px at 100% 30%, rgba(34,211,238,.08), transparent 60%), var(--fondo); min-height: 100vh; }
    .cx { max-width: 760px; margin: 0 auto; padding: 22px 16px 120px; }
    .marca { text-align: center; font-weight: 800; letter-spacing: .14em; font-size: 13px; color: var(--suave); text-transform: uppercase; margin-bottom: 18px; }
    h1 { font-size: clamp(30px, 7vw, 52px); line-height: 1.05; text-align: center; margin: 6px 0 12px; font-weight: 800; }
    h1 .brilla { background: linear-gradient(90deg, var(--a1), var(--a2), var(--a3)); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 40px rgba(168,85,247,.35); }
    h2 { font-size: 24px; text-align: center; margin: 4px 0 6px; }
    .sub { text-align: center; color: var(--suave); font-size: 15px; line-height: 1.5; margin: 0 auto 22px; max-width: 520px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px 18px; border: 0; border-radius: 14px; font: inherit; font-weight: 700; font-size: 16px; color: #fff; cursor: pointer; background: linear-gradient(90deg, #0ea5e9, #7c3aed); box-shadow: 0 10px 30px rgba(124,58,237,.35); text-decoration: none; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.claro { background: transparent; border: 1px solid var(--borde); box-shadow: none; color: var(--texto); }
    .btn.wa { background: linear-gradient(90deg, #16a34a, #22c55e); box-shadow: 0 10px 30px rgba(34,197,94,.3); }
    .fila { display: flex; gap: 10px; margin-top: 16px; }
    .fila .btn { flex: 1; }
    .caja { background: var(--caja); border: 1px solid var(--borde); border-radius: 18px; padding: 18px; }
    .opciones { display: grid; gap: 12px; }
    .op { text-align: left; background: var(--caja); border: 1.5px solid var(--borde); border-radius: 16px; padding: 14px 16px; color: var(--texto); font: inherit; cursor: pointer; position: relative; isolation: isolate; scroll-margin-top: 14px; transition: border-color .15s, box-shadow .15s; }
    .op b { display: block; font-size: 16px; margin-bottom: 4px; }
    .op small { color: var(--suave); font-size: 13px; line-height: 1.4; }
    .op .extra { float: right; font-size: 12px; font-weight: 700; color: var(--a1); background: rgba(34,211,238,.1); padding: 3px 8px; border-radius: 999px; }
    .subir { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 34px 16px; border: 1.5px dashed #3a4060; border-radius: 18px; text-align: center; cursor: pointer; background: radial-gradient(400px 200px at 50% 0%, rgba(59,130,246,.10), transparent 70%), rgba(255,255,255,.02); }
    .subir:hover { border-color: var(--a1); }
    .subir small { color: var(--suave); font-size: 13px; }
    .subir .nube { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #16294a; border: 1px solid #23406e; color: #fff; position: relative; animation: nubeBrilla 2.4s ease-in-out infinite; }
    .subir .nube svg { width: 34px; height: 34px; animation: nubeSube 1.8s ease-in-out infinite; }
    .subir .nube::after { content: ""; position: absolute; inset: -1px; border-radius: 50%; border: 2px solid rgba(56,189,248,.55); animation: nubeOnda 2.4s ease-out infinite; }
    @keyframes nubeSube { 0%, 100% { transform: translateY(2px); } 50% { transform: translateY(-5px); } }
    @keyframes nubeBrilla { 0%, 100% { box-shadow: 0 0 0 rgba(56,189,248,0); } 50% { box-shadow: 0 0 26px rgba(56,189,248,.35); } }
    @keyframes nubeOnda { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.55); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .subir .nube, .subir .nube svg, .subir .nube::after { animation: none; } }
    .subir .arrastra { font-size: 15px; color: #cbd5e1; }
    .btn-subir { display: inline-block; padding: 12px 26px; border-radius: 12px; font-weight: 700; font-size: 17px; color: #fff; background: linear-gradient(180deg, #0ea5e9, #1d6fe8); box-shadow: 0 0 0 2px rgba(56,189,248,.35), 0 8px 24px rgba(29,111,232,.35); }
    .formatos { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .formatos i { font-style: normal; font-size: 12px; font-weight: 600; color: #94a3b8; padding: 5px 14px; border-radius: 999px; background: #161a26; border: 1px solid #262b3c; }
    .pared { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 4 / 3.2; background: radial-gradient(60% 50% at 50% 35%, #2a2d3a, #15171f 70%), #15171f; border: 1px solid var(--borde); display: flex; align-items: center; justify-content: center; }
    .pared::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: linear-gradient(180deg, rgba(0,0,0,.3), rgba(0,0,0,.6)); pointer-events: none; }
    .maqueta { width: 100%; height: auto; border-radius: 18px; border: 1px solid var(--borde); display: block; box-shadow: 0 20px 60px rgba(0,0,0,.5); background: #11131c; min-height: 160px; }
    .maqueta-caja { position: relative; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    .maqueta-tapa { position: absolute; inset: 0; border-radius: 18px; }
    .rango { width: 100%; accent-color: var(--a2); margin: 14px 0 6px; }
    .medidas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    label.campo { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--suave); }
    label.campo input, label.campo textarea { background: var(--caja2); border: 1px solid var(--borde); color: var(--texto); border-radius: 12px; padding: 12px; font: inherit; font-size: 16px; }
    textarea { resize: vertical; min-height: 70px; }
    .barra { position: fixed; left: 0; right: 0; bottom: var(--barra-abajo, 0px); transition: bottom .12s linear; z-index: 20; background: rgba(10,11,17,.92); backdrop-filter: blur(10px); border-top: 1px solid var(--borde); padding: 12px 16px; display: none; }
    .barra.ver { display: block; }
    .barra .in { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
    .barra-precio { display: flex; align-items: center; justify-content: space-between; }
    .barra-btns { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
    .barra-btns .btn { padding: 13px 14px; }
    body.con-barra .fila-paso, body.con-barra .precio-linea { display: none; }
    /* Dentro de Shopify (como app): sin barra gris de desplazamiento y barra de abajo compacta */
    html.modo-app { scrollbar-width: none; overscroll-behavior: contain; }
    html.modo-app body { overscroll-behavior: contain; }
    html.modo-app::-webkit-scrollbar { display: none; }
    html.modo-app .barra { padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
    html.modo-app .barra .in { gap: 8px; }
    html.modo-app .barra .total { font-size: 19px; }
    html.modo-app .barra-btns .btn { padding: 11px 12px; font-size: 15px; }
    html.modo-app .cx { padding-top: 14px; }
    html.ios-tienda .barra { padding-bottom: 74px; }
    html.ios-tienda body.con-barra .cx { padding-bottom: 240px; }
    body.con-barra .cx { padding-bottom: 170px; }
    @media (min-width: 640px) { .barra .in { flex-direction: row; align-items: center; justify-content: space-between; } .barra-btns { min-width: 360px; } }
    .barra .total { font-size: 22px; font-weight: 800; }
    .barra small { color: var(--suave); display: block; font-size: 12px; }
    .pasos { display: flex; gap: 6px; justify-content: center; margin: 0 0 18px; }
    .pasos i { width: 26px; height: 4px; border-radius: 4px; background: #2a2e40; }
    .pasos i.on { background: linear-gradient(90deg, var(--a1), var(--a2)); }
    .esfera { width: 110px; height: 110px; border-radius: 50%; margin: 30px auto 24px; background: radial-gradient(circle at 35% 30%, #fff, var(--c, #22d3ee) 35%, #000 120%); box-shadow: 0 0 60px var(--c, #22d3ee); animation: late 1.6s ease-in-out infinite; transition: background .6s, box-shadow .6s; }
    @keyframes late { 50% { transform: scale(1.08) rotate(8deg); } }
    .progreso { height: 6px; border-radius: 6px; background: #22263a; overflow: hidden; margin: 20px 0 8px; }
    .progreso div { height: 100%; width: 0; background: linear-gradient(90deg, var(--a1), var(--a2), var(--a3)); transition: width .5s; }
    .beneficio { text-align: center; color: var(--texto); font-weight: 600; min-height: 22px; transition: opacity .3s; }
    .desglose { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
    .desglose td { padding: 7px 0; border-bottom: 1px solid #1f2232; }
    .desglose td:last-child { text-align: right; font-weight: 600; }
    .desglose tr.tot td { font-size: 18px; font-weight: 800; border-bottom: 0; padding-top: 12px; }
    .aviso { background: rgba(250,204,21,.08); border: 1px solid rgba(250,204,21,.25); color: #fde68a; border-radius: 12px; padding: 10px 12px; font-size: 13px; margin: 12px 0; }
    .error { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #fecaca; border-radius: 12px; padding: 10px 12px; font-size: 14px; margin: 12px 0; }
    .galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .galeria figure { margin: 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--borde); background: var(--caja); }
    .galeria img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .galeria figcaption { font-size: 12px; color: var(--suave); padding: 7px 9px; }
    .seccion { margin-top: 34px; }
    .seccion h3 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--a1); text-align: center; margin: 0 0 12px; }
    .contador { display: flex; align-items: center; gap: 10px; }
    .contador button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--borde); background: var(--caja2); color: var(--texto); font-size: 20px; cursor: pointer; }
    .contador span { min-width: 30px; text-align: center; font-weight: 700; font-size: 18px; }
    .mini { color: var(--suave); font-size: 12.5px; text-align: center; margin-top: 10px; }
    .oculto { display: none !important; }
    .medidas-mini { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .medidas-mini label { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; background: var(--caja2); border: 1px solid var(--borde); font-size: 12px; color: var(--suave); }
    .medidas-mini input { flex: 1; min-width: 0; width: 100%; background: transparent; border: 0; color: var(--texto); font: inherit; font-size: 16px; font-weight: 700; text-align: right; outline: none; }
    .medidas-mini em { font-style: normal; font-size: 12px; }
    .logo-listo { margin-top: 14px; display: flex; align-items: center; justify-content: center; min-height: 200px; padding: 18px; border-radius: 18px; background: var(--caja); border: 1px solid var(--borde); }
    .logo-listo img { max-width: 100%; max-height: 300px; object-fit: contain; border-radius: 8px; }
    /* Paso del tamaño: pared con marco que brilla, cotas y regla */
    .pared .planta { position: absolute; left: 5%; bottom: 22%; width: 9%; height: 26%; border-radius: 40% 40% 10% 10%; background: radial-gradient(circle at 50% 30%, #1f3b2c, #0d1a13); opacity: .8; }
    .pared .lampara { position: absolute; right: 6%; bottom: 22%; width: 7%; height: 9%; border-radius: 40% 40% 4px 4px; background: radial-gradient(circle at 50% 20%, #ffd58a, #a86a1d); box-shadow: 0 0 40px 12px rgba(255,190,90,.25); }
    .marco { position: relative; z-index: 1; max-height: 62%; max-width: 70%; border: 3px solid #fde68a; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.25); box-shadow: 0 0 10px rgba(253,230,138,.8), 0 0 34px rgba(250,204,21,.45), inset 0 0 18px rgba(250,204,21,.18); transition: width .12s; }
    .marco img { max-width: 86%; max-height: 86%; object-fit: contain; }
    .marco.luz img { filter: drop-shadow(0 0 6px rgba(255,255,255,.5)) drop-shadow(0 0 18px rgba(168,85,247,.5)); }
    .cota { position: absolute; color: #93c5fd; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .cota i { position: absolute; background: #60a5fa; }
    .cota.an { left: 0; right: 0; top: calc(100% + 10px); text-align: center; }
    .cota.an i { left: 0; right: 0; top: -5px; height: 2px; }
    .cota.an i::before, .cota.an i::after { content: ""; position: absolute; top: -4px; width: 2px; height: 10px; background: #60a5fa; }
    .cota.an i::before { left: 0; } .cota.an i::after { right: 0; }
    .cota.an b { position: relative; top: 4px; }
    .cota.al { top: 0; bottom: 0; left: calc(100% + 10px); display: flex; align-items: center; }
    .cota.al i { top: 0; bottom: 0; left: 0; width: 2px; }
    .cota.al i::before, .cota.al i::after { content: ""; position: absolute; left: -4px; width: 10px; height: 2px; background: #60a5fa; }
    .cota.al i::before { top: 0; } .cota.al i::after { bottom: 0; }
    .cota.al b { padding-left: 8px; }
    .regla { padding: 4px 2px 2px; }
    .regla-fila { display: flex; align-items: center; gap: 10px; }
    .regla-btn { width: 34px; height: 34px; flex: 0 0 auto; border-radius: 10px; border: 1px solid var(--borde); background: var(--caja2); color: var(--texto); font-size: 20px; line-height: 1; cursor: pointer; }
    .regla-pista { position: relative; flex: 1; padding-top: 26px; }
    .regla-valor { position: absolute; top: 0; transform: translateX(-50%); padding: 3px 9px; border-radius: 8px; font-size: 12px; font-weight: 800; color: #fff; background: #1d4ed8; box-shadow: 0 0 0 2px rgba(96,165,250,.45), 0 0 14px rgba(59,130,246,.6); white-space: nowrap; pointer-events: none; }
    .regla .rango { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; margin: 0; border-radius: 6px; background: linear-gradient(90deg, #3b82f6 0, #8b5cf6 var(--p, 50%), #2a2f45 var(--p, 50%)); outline: none; }
    .regla .rango::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 4px solid #3b82f6; box-shadow: 0 0 12px rgba(59,130,246,.8); cursor: grab; }
    .regla .rango::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 4px solid #3b82f6; box-shadow: 0 0 12px rgba(59,130,246,.8); }
    .regla-marcas { display: flex; align-items: center; gap: 8px; margin: 6px 44px 0; font-size: 11px; color: var(--suave); }
    .regla-marcas i { flex: 1; height: 10px; background: repeating-linear-gradient(90deg, #4b5268 0 1px, transparent 1px 8px); }
    #barraRegla:empty { display: none; }
    #barraRegla { margin-bottom: 2px; }
    .cargando { display: flex; justify-content: center; gap: 8px; padding: 80px 0; }
    .cargando span { width: 10px; height: 10px; border-radius: 50%; background: var(--a2); animation: punto 1s ease-in-out infinite; }
    .cargando span:nth-child(2) { animation-delay: .15s; } .cargando span:nth-child(3) { animation-delay: .3s; }
    @keyframes punto { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-6px); } }
    /* Opción elegida: borde de luz de colores que da vueltas */
    .op.on { border-color: transparent; overflow: hidden; box-shadow: 0 0 22px rgba(168,85,247,.45), 0 0 46px rgba(34,211,238,.18); animation: opBrillo 2.4s ease-in-out infinite; }
    .op.on::before { content: ""; position: absolute; z-index: -2; left: 50%; top: 50%; width: 220%; aspect-ratio: 1; transform: translate(-50%, -50%); background: conic-gradient(from 0deg, #22d3ee, #3b82f6, #a855f7, #ec4899, #f59e0b, #22d3ee); animation: opGira 2.8s linear infinite; }
    .op.on::after { content: ""; position: absolute; z-index: -1; inset: 2px; border-radius: 14px; background: linear-gradient(180deg, #151829, #10121c); }
    @keyframes opGira { to { transform: translate(-50%, -50%) rotate(360deg); } }
    @keyframes opBrillo { 0%, 100% { box-shadow: 0 0 18px rgba(168,85,247,.4), 0 0 40px rgba(34,211,238,.15); } 50% { box-shadow: 0 0 28px rgba(236,72,153,.5), 0 0 56px rgba(59,130,246,.25); } }
    @media (prefers-reduced-motion: reduce) { .op.on::before, .op.on { animation: none; } }
    .precio-linea { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 18px; padding: 12px 14px; border-radius: 14px; background: linear-gradient(90deg, rgba(14,165,233,.12), rgba(124,58,237,.14)); border: 1px solid rgba(124,58,237,.35); }
    .precio-linea span { display: flex; flex-direction: column; }
    .precio-linea small { color: var(--suave); font-size: 12px; }
    .precio-linea b { font-size: 22px; font-weight: 800; }
    .precio-linea em { font-style: normal; font-size: 12.5px; font-weight: 700; color: #4ade80; background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.35); padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
    .en-shopify body { min-height: 0; }
    .en-shopify .cx { padding-bottom: 40px; }
    .color-luz { margin-top: 14px; padding: 14px; border-radius: 16px; background: var(--caja); border: 1px solid var(--borde); }
    .color-luz b { display: block; margin-bottom: 10px; font-size: 15px; }
    .colores { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .colores .color { display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--borde); background: var(--caja2); color: var(--texto); font: inherit; font-size: 13px; cursor: pointer; }
    .colores .color i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 1px rgba(255,255,255,.35); }
    .colores .color.on { border-color: var(--a2); box-shadow: 0 0 0 2px rgba(168,85,247,.3); }
    .color-luz input { width: 100%; box-sizing: border-box; background: var(--caja2); border: 1px solid var(--borde); color: var(--texto); border-radius: 12px; padding: 11px 12px; font: inherit; font-size: 16px; }
    /* Gancho de envío gratis */
    .envio-fila td:last-child s { color: #64748b; font-weight: 500; margin-right: 6px; }
    .envio-fila td:last-child b { color: #4ade80; letter-spacing: .04em; }
    .envio-gratis { position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px; margin: 12px 0 4px; padding: 12px 14px; border-radius: 14px; background: linear-gradient(90deg, #052e1a, #0b4a2b); border: 1.5px solid #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.15), 0 0 24px rgba(34,197,94,.35); animation: envioLate 2.2s ease-in-out infinite; }
    .envio-gratis::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.28), transparent); animation: envioBrillo 3s ease-in-out infinite; }
    .envio-gratis .camion { font-size: 28px; animation: camionVa 1.6s ease-in-out infinite; }
    .envio-gratis b { display: block; font-size: 17px; font-weight: 800; color: #4ade80; letter-spacing: .02em; text-shadow: 0 0 12px rgba(74,222,128,.5); }
    .envio-gratis small { color: #bbf7d0; font-size: 12.5px; }
    @keyframes envioLate { 0%, 100% { box-shadow: 0 0 0 3px rgba(34,197,94,.15), 0 0 18px rgba(34,197,94,.25); } 50% { box-shadow: 0 0 0 3px rgba(34,197,94,.3), 0 0 34px rgba(34,197,94,.55); } }
    @keyframes envioBrillo { 0% { left: -60%; } 60%, 100% { left: 130%; } }
    @keyframes camionVa { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
    @media (prefers-reduced-motion: reduce) { .envio-gratis, .envio-gratis::after, .envio-gratis .camion { animation: none; } }
    .marca img { height: 46px; max-width: 80%; object-fit: contain; }
    .op.con-foto { display: flex; gap: 12px; align-items: center; padding: 10px; }
    .op-foto { position: relative; flex: 0 0 auto; }
    .op.con-foto img { width: 104px; height: 104px; object-fit: contain; border-radius: 12px; display: block; background: #0b0d14; border: 1px solid #222637; padding: 4px; box-sizing: border-box; }
    .op-foto em { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); font-style: normal; font-size: 9px; font-weight: 800; letter-spacing: .12em; color: #fff; background: rgba(0,0,0,.65); padding: 3px 7px; border-radius: 999px; backdrop-filter: blur(4px); }
    /* Recortar */
    /* Recorte: la imagen cabe completa en la pantalla (sea horizontal o vertical) y los botones quedan a la vista */
    .recorte-zona { display: flex; justify-content: center; margin-top: 4px; }
    .recorte { position: relative; display: inline-block; border-radius: 10px; overflow: hidden; touch-action: none; user-select: none; background: #e5e7eb repeating-conic-gradient(#d1d5db 0% 25%, #f3f4f6 0% 50%) 0 0 / 20px 20px; }
    .recorte img { display: block; max-width: 100%; max-height: calc(100vh - 250px); max-height: calc(100svh - 250px); max-height: calc(var(--vista, 100svh) - 250px); min-height: 120px; width: auto; height: auto; pointer-events: none; }
    .recorte-paso { text-align: center; }
    .caja-rec { position: absolute; border: 2px dashed #fff; box-shadow: 0 0 0 9999px rgba(0,0,0,.55); cursor: move; touch-action: none; }
    .caja-rec i { position: absolute; width: 26px; height: 26px; border: 3px solid #fff; background: rgba(255,255,255,.15); touch-action: none; }
    .caja-rec i[data-h="nw"] { left: -13px; top: -13px; cursor: nwse-resize; }
    .caja-rec i[data-h="ne"] { right: -13px; top: -13px; cursor: nesw-resize; }
    .caja-rec i[data-h="sw"] { left: -13px; bottom: -13px; cursor: nesw-resize; }
    .caja-rec i[data-h="se"] { right: -13px; bottom: -13px; cursor: nwse-resize; }
    .enlace { background: none; border: 0; color: var(--a1); font: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; }
    /* Reseñas en tarjetas (de borde a borde, se deslizan solas) */
    .seccion h3.izq { text-align: left; color: #fbbf24; font-size: 13px; letter-spacing: .1em; }
    .res-sec { width: 100vw; margin-left: calc(50% - 50vw); }
    .res-sec h3.izq { max-width: 728px; margin: 0 auto 12px; padding: 0 16px; }
    .resenas { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 0 16px 4px; }
    .resenas::-webkit-scrollbar { display: none; }
    .resenas.auto { scroll-snap-type: none; }
    .resena { flex: 0 0 min(84vw, 330px); scroll-snap-align: start; display: flex; gap: 12px; align-items: stretch; background: #12141d; border: 1px solid #222637; border-radius: 16px; padding: 12px; }
    .resena img { width: 104px; height: 104px; object-fit: cover; border-radius: 10px; flex: 0 0 auto; align-self: center; }
    .resena.solo-foto { flex-basis: 190px; padding: 0; overflow: hidden; }
    .resena.solo-foto img { width: 100%; height: 100%; min-height: 128px; border-radius: 0; }
    .res-txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
    .res-txt p { margin: 0; font-size: 13px; line-height: 1.45; color: #e2e8f0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .res-quien { margin-top: auto; padding-top: 8px; border-top: 1px solid #262b3c; display: flex; flex-direction: column; }
    .res-quien b { font-size: 14px; }
    .res-quien small { color: var(--suave); font-size: 11.5px; }
    .estrellas { color: #facc15; letter-spacing: 2px; font-size: 14px; }
    /* Carrusel tu logo → así quedó */
    .carrusel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; border-radius: 20px; }
    .carrusel::-webkit-scrollbar { display: none; }
    .slide { flex: 0 0 100%; scroll-snap-align: center; display: grid; gap: 10px; }
    .lado { position: relative; border-radius: 18px; overflow: hidden; background: var(--caja); border: 1px solid var(--borde); aspect-ratio: 16 / 10; display: flex; align-items: center; justify-content: center; }
    .lado img.antes { max-width: 55%; max-height: 70%; object-fit: contain; border-radius: 6px; }
    .lado img.despues { width: 100%; height: 100%; object-fit: cover; }
    .etq { position: absolute; top: 12px; left: 12px; z-index: 1; font-size: 12px; font-weight: 700; letter-spacing: .14em; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.08); color: #cbd5e1; backdrop-filter: blur(6px); }
    .etq.azul { left: auto; right: 12px; background: #1d6fe8; color: #fff; }
    .slide-tit { margin: 0; text-align: center; color: var(--suave); font-size: 13px; }
    .puntos { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
    .puntos button { width: 10px; height: 10px; padding: 0; border-radius: 50%; border: 1.5px solid #64748b; background: transparent; cursor: pointer; }
    .puntos button.on { background: #1d6fe8; border-color: #1d6fe8; }
    @media (min-width: 640px) { .slide { grid-template-columns: 1fr 1fr; } .slide-tit { grid-column: 1 / -1; } }
    /* Cinta que se mueve */
    .cinta { margin: 30px -16px 0; overflow: hidden; border-top: 1px solid #1a1d29; border-bottom: 1px solid #1a1d29; padding: 14px 0; }
    .cinta-in { display: flex; gap: 40px; width: max-content; animation: cinta 26s linear infinite; }
    .cinta span { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #cbd5e1; white-space: nowrap; }
    .cinta span::before { content: "✦"; margin-right: 40px; color: var(--a2); }
    @keyframes cinta { to { transform: translateX(-50%); } }
    /* 3 pasos */
    h2.grande { font-size: clamp(26px, 6vw, 38px); margin: 0 0 22px; }
    h2.grande.izq { text-align: left; }
    .pasos3 { text-align: center; }
    .paso3 { margin: 0 auto 26px; max-width: 320px; }
    .paso3 b { display: block; font-size: 18px; margin: 12px 0 6px; }
    .paso3 p { margin: 0; color: var(--suave); font-size: 15px; line-height: 1.5; }
    .ico3 { width: 54px; height: 54px; border-radius: 16px; background: #1f2433; color: #3b8cff; display: inline-flex; align-items: center; justify-content: center; }
    .ico3 svg { width: 26px; height: 26px; }
    .ico3.chico { width: 42px; height: 42px; border-radius: 50%; flex: 0 0 auto; }
    .ico3.chico svg { width: 20px; height: 20px; }
    @media (min-width: 640px) { .pasos3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; } .pasos3 h2 { grid-column: 1 / -1; } }
    /* De la maqueta a la realidad */
    .taller-txt { color: #cbd5e1; font-size: 16px; line-height: 1.6; margin: 0 0 16px; }
    .punto { display: flex; gap: 12px; align-items: center; background: var(--caja); border: 1px solid var(--borde); border-radius: 16px; padding: 14px; margin-bottom: 16px; }
    .punto b { display: block; font-size: 15px; }
    .punto small { color: var(--suave); font-size: 13px; }
    .taller-foto { width: 100%; border-radius: 18px; display: block; margin-top: 10px; border: 1px solid var(--borde); }
    @media (min-width: 640px) { .opciones.dos { grid-template-columns: 1fr 1fr; } }
  </style>
</head>

  <main class="cx" id="app"><div class="cargando"><span></span><span></span><span></span></div></main>
  <script>
    // Pedir la configuración de una vez, en paralelo con el resto de la página
    window.__cdxConfig = fetch("/api/cotiza/" + encodeURIComponent((location.pathname.split("/").filter(Boolean)[1] || "")) + "/config").then(r => r.json().then(d => (r.ok ? d : Promise.reject(new Error(d.error || "No se pudo abrir el cotizador")))));
    window.__cdxConfig.catch(() => {});
  </script>
  <div class="barra" id="barra"><div class="in">
    <div id="barraRegla"></div>
    <div class="barra-precio"><div><small id="barraTxt">Precio estimado</small><span class="total" id="barraTotal">—</span></div></div>
    <div class="barra-btns"><button class="btn claro" id="barraAtras">Atrás</button><button class="btn" id="barraBtn">Continuar</button></div>
  </div></div>
  <script type="module" src="/js/cotiza.js"></script>
</body>
