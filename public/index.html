<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoDropX</title>

  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CoDropX">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">
  <aside id="sidebar"></aside>
  <main id="view"></main>
</div>

<script type="module" src="js/app.js"></script>

<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>

<!-- 👇 AQUÍ -->
<div id="modalConfirm" class="modal-overlay hidden">
  <div class="modal-box">
    <h3>¿Eliminar producto?</h3>
    <p>Esta acción no se puede deshacer.</p>

    <div class="modal-actions">
      <button id="btnCancelar" class="btn-cancel">Cancelar</button>
      <button id="btnAceptar" class="btn-delete">Eliminar</button>
    </div>
  </div>
</div>

  <script>
    if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    // Android/Chrome: guardar el aviso de instalación para el botón "Instalar en el celular" del Inicio
    addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); window.__instalarApp = e; });
  </script>
</body>
</html>
