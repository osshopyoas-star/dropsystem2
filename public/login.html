<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · CoDropX</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, sans-serif;
      color: #0f172a;
      background:
        radial-gradient(900px 500px at 15% -10%, rgba(59,130,246,.35), transparent 60%),
        radial-gradient(700px 500px at 110% 110%, rgba(124,58,237,.30), transparent 60%),
        linear-gradient(180deg, #020617, #0f172a);
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 20px;
      padding: 32px 28px 28px;
      box-shadow: 0 30px 60px rgba(2, 6, 23, .45);
    }

    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .logo-box {
      background: #020617;
      border-radius: 14px;
      padding: 12px 18px;
      display: inline-flex;
    }

    .logo img { height: 34px; display: block; }

    h1 {
      font-size: 22px;
      margin: 0 0 4px;
      text-align: center;
    }

    p.sub {
      margin: 0 0 24px;
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #475569;
      margin: 0 0 6px;
    }

    input {
      width: 100%;
      font: inherit;
      font-size: 15px;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #f8fafc;
      margin-bottom: 16px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,.18);
      background: #fff;
    }

    button {
      width: 100%;
      font: inherit;
      font-weight: 600;
      font-size: 15px;
      color: #fff;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      cursor: pointer;
      background: linear-gradient(90deg, #3b82f6, #7c3aed);
      transition: opacity .15s, transform .05s;
    }

    button:hover { opacity: .92; }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .6; cursor: wait; }

    .error {
      display: none;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .error.show { display: block; }

    .foot {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 18px;
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="logo">
      <div class="logo-box"><img src="/assets/logo.png" alt="CoDropX"></div>
    </div>

    <h1>Bienvenido</h1>
    <p class="sub">Inicia sesión para entrar a tu workspace</p>

    <div id="error" class="error" role="alert"></div>

    <form id="form" novalidate>
      <label for="email">Correo</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button id="btn" type="submit">Entrar</button>
    </form>

    <div class="foot">CoDropX · Workspace de ecommerce</div>
  </main>

  <script>
    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const errorBox = document.getElementById("error");

    function mostrarError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add("show");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.remove("show");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        mostrarError("Escribe tu correo y contraseña.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Entrando...";

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          mostrarError(data.error || "No se pudo iniciar sesión.");
          return;
        }

        window.location.href = "/";
      } catch (err) {
        mostrarError("No hay conexión con el servidor. Intenta de nuevo.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
